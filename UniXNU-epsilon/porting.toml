# UniXNU porting record for epsilon (Project iPhoneDuo).
# Schema: UniXNU/UniXNU@21d683dff61c66f219f03ab9d8b9249026514788 docs/porting/records.md,
# examples/device/porting.toml, scripts/porting-record.py.
#
# Identity must match board.toml, so device.os_profile is the RESOLVABLE DIAGNOSTIC profile
# (ipados-17.7.11-21H461, arm64). The PROJECT PRIMARY TARGET is iOS 27
# (ipados-27.0.1-24A446, arm64e) and is UNVERIFIED-PENDING-HARDWARE; see the configuration
# and cpu areas. Device: NOT contacted. Every UNKNOWN-PH value needs the read-only device
# audit (Phase 1 T7) before it can be used.
schema_version = 1

[device]
name = "epsilon"
soc = "SM8150"
os_profile = "ipados-17.7.11-21H461"
summary = "Microsoft Surface Duo 1 scaffold. Primary target iOS 27 (ipados-27.0.1-24A446, arm64e) is UNVERIFIED-PENDING-HARDWARE: SM8150 Kryo 485 is ARMv8.2-A and is inferred to lack FEAT_PAuth. Resolvable diagnostic profile ipados-17.7.11-21H461 (arm64). Host resolution only; no build, no boot, device not contacted."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform"]
paths = ["board.toml", "feeds.toml", "unixnu.lock", "local.toml.example", "configs/**", ".gitignore", ".github/**", "porting.toml", "README.md", "AGENTS.md"]
inputs = ["UniXNU/UniXNU@21d683dff61c66f219f03ab9d8b9249026514788 (arm64 profile, ipados-17.7.11-21H461 profile); guowenye/UniXNU-sm8150-common@f8bc872ce6254a84ecae839edcba9145a591e655 (soc_source sm8150); template guowenye/UniXNU-raphael@1c435f2291edab0eda01bef865bdf4e7d69a9aa2.", "Primary target ipados-27.0.1-24A446 (arm64e, xnu-12377.121.6): UNVERIFIED-PENDING-HARDWARE. Declared in board.toml [iphoneduo]; not resolved by this configuration."]
configuration = ["schema_version 2; [board] name epsilon, soc SM8150, soc_source sm8150, os_profile ipados-17.7.11-21H461, kit epsilon, example true (safety latch: build/bootimg/release refuse).", "[components] include = XnuPrelink, DarwinBoot, ArmDTPlatform (replaces the arm64 list; ArmCpu excluded for blocker B1, SoftwareAES omitted as in raphael).", "[kernel] defconfig epsilon_defconfig; config_fragments arch:configs/common.config, soc:configs/sm8150.config; patch_series arch, soc, device:patches/xnu/os-bootstrap.series, device:patches/xnu/series; archives build-corecrypto-14.py and build-corecrypto-14.py --namespace.", "[package] unixnu_revision 21d683dff61c66f219f03ab9d8b9249026514788; [package.defconfig] ipados-17.7.11-21H461 = epsilon_defconfig."]
procedure = ["From the UniXNU checkout: ./unixnu defconfig epsilon_defconfig -D <device> --out <scratch>; ./unixnu fetch -D <device> --out <scratch>; ./unixnu status --json -D <device> --out <scratch>; python3 scripts/porting-record.py check --device <device>."]
findings = ["The arm64 profile and SoC fragment resolve with the raphael-equivalent patch order. The device series is intentionally empty, so only arch, SoC (empty) and the two XnuPrelink OS-bootstrap patches apply.", "Unknown top-level board tables merge by key and are ignored by the resolver; [iphoneduo] carries the primary-target declaration without changing resolution."]
completion = ["All profile roots, source pins, component closure and patch order resolve; the package maps to kits/epsilon; the diagnostic profile resolves to arch arm64 and xnu 10063.141.1."]
limits = ["The configuration is a scaffold: example = true, and no firmware, bootimg, userdata or payload sections are declared (all UNKNOWN-PH).", "No device repository commit exists yet (not a git repository), so no host-verified evidence with a 40-character revision can be recorded.", "iOS 27 is not configured: no os_overrides, defconfig or patch series exist for ipados-27.0.1-24A446."]
next_action = ["Initialise the device repository in Git when the orchestrator decides, commit, and record the resolution as host evidence with the full revision.", "After the read-only audit, fill [firmware], [bootimg], [payload] and [payload.adt] from measured values only."]

