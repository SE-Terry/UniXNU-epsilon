[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/**", "patches/xnu/series"]
inputs = ["8 CPUs, MPIDR 0x000..0x700 (V-src: MU ArmPlatformLib.c, ACPI APIC.aml); CPU0-3 A55, CPU4-6 A76, CPU7 A76 prime (Kryo 485).", "GICv3 GIC-500: GICD 0x17A00000 (+0x10000), GICR 0x17A60000 (+0x100000, stride 0x20000), maintenance PPI 9 (V-src: ACPI APIC.aml, Linux).", "Arch timer INTIDs: virtual 19 (PPI 3), NS-EL1 physical 18 (PPI 2), secure 17, NS-EL2 16 (V-src: ACPI GTDT.aml, Linux timer node). INTID 27 is SM8350 and must not be used.", "UNKNOWN-PH: CNTFRQ_EL0 (19.2 MHz assumed), CurrentEL, which timer PPI fires under QHEE, enabled-CPU policy."]
configuration = ["dts/epsilon.dts restates cpu@0..cpu@700 reg, the &gic reg/stride/maintenance interrupt and the /timer interrupts over soc:dts/sm8150.dtsi.", "ArmCpu not selected: drivers/ArmCpu@acba4ee ArmCpu.cpp:142-143 hard-codes virtual timer PPI 27 (blocker B1).", "arm64e requirement checks (docs/porting/arm64e.md), all UNVERIFIED-PENDING-HARDWARE: (1) ID_AA64ISAR1_EL1 APA|API and GPA|GPI, or ID_AA64ISAR2_EL1 APA3 and GPA3, nonzero on every CPU; (2) EL1 writes to APIAKey/APIBKey/APDAKey/APDBKey/APGAKey do not trap; (3) PACIA changes and AUTIA restores a pointer on every core."]
procedure = ["Read-only audit (T7, needs approval): cpuinfo features (paca/pacg expected absent), ID_AA64ISAR1_EL1/ISAR2 on all 8 cores, CNTFRQ_EL0, CurrentEL; then the tiny firmware payload reports the same at EL1."]
findings = ["Kryo 485 is ARMv8.2-A and the Duo firmware is built with -march=armv8.2-a (MU Andromeda.dsc.inc:640), so FEAT_PAuth is expected to be absent. This is an [A]-grade inference, not a measurement on epsilon.", "raphael (same SoC) replaces ArmCpu with an independent boot-CPU personality and uses the physical timer; the epsilon patch plan follows that model (patches/xnu/series, commented)."]
completion = ["Every enabled CPU reaches its entry checkpoint, and the measured timer PPI delivers IRQs and EOIs on the boot CPU. Each arm64e requirement check has a recorded device result."]
limits = ["No CPU or timer code; no measurement. Single-boot-CPU bring-up assumed (raphael model); SMP is deferred (B4)."]
next_action = ["Run E1 (ID-register PAC check) and the timer-PPI measurement in the approved read-only audit."]
evidence = []

